name: diag
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: annotation test
        run: |
          echo "::error title=diag-annotation::the annotation channel works"
      - name: summary test
        run: echo "### diag summary works" >> "$GITHUB_STEP_SUMMARY"
      - name: push test
        run: |
          mkdir -p ci-logs
          echo "diag log line" > ci-logs/diag.log
          git config user.name sentinel-ci
          git config user.email ci@sentinel.invalid
          git add -f ci-logs
          git commit -qm "ci: diag log" || true
          git push --force origin "HEAD:refs/heads/ci-logs" 2>&1 | tail -5 || true
          git ls-remote origin ci-logs || echo "remote has no ci-logs"
