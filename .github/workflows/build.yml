name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── fast feedback: does the agent boot, answer, and refuse bad input? ────
  check:
    name: Agent checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Behaviour tests (signatures, replay, policy, secrets)
        run: node test/run.js
      - name: Syntax, assets and boot test
        run: node scripts/check.js

  # ── Windows executables: headless agent + desktop console ───────────────
  windows:
    name: Windows executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        shell: pwsh
        run: |
          npm install --no-audit --no-fund *>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) { ./scripts/ci-fail.ps1 -LogFile install.log -Label windows-install }
      - name: Build SENTINEL-Agent.exe (single file, no installer)
        shell: pwsh
        run: |
          npx @yao-pkg/pkg bin/sentinel-agent.js --targets node22-win-x64 --compress GZip --output dist/SENTINEL-Agent.exe *>&1 | Tee-Object -FilePath pkg.log
          if ($LASTEXITCODE -ne 0) { ./scripts/ci-fail.ps1 -LogFile pkg.log -Label pkg }
      - name: Build desktop app (installer + portable)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64 --publish never *>&1 | Tee-Object -FilePath eb.log
          if ($LASTEXITCODE -ne 0) { ./scripts/ci-fail.ps1 -LogFile eb.log -Label electron-builder }
      - name: Smoke-test the packaged agent
        shell: pwsh
        run: |
          $env:SENTINEL_HOME = "$env:RUNNER_TEMP\sentinel-smoke"
          $p = Start-Process -FilePath "dist\SENTINEL-Agent.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          try {
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:7878/api/health" -TimeoutSec 15
            if (-not $health.ok) { throw "agent did not report healthy" }
            Write-Host "agent healthy on port 7878 ($($health.name))"
          } catch {
            Write-Output "::error file=smoke::$_"
            exit 1
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows
          path: |
            dist/SENTINEL-Agent.exe
            dist/SENTINEL-Setup-*.exe
            dist/SENTINEL-Portable-*.exe
          if-no-files-found: error
          retention-days: 30

  # ── Android APK, signed with a keystore generated during the build ───────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 6 ships Gradle 8.2 / AGP 8.2, which needs JDK 17.
          java-version: '17'
      - name: Install Capacitor
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund 2>&1 | tee /tmp/npm.log \
            || bash ../scripts/ci-fail.sh /tmp/npm.log "mobile-npm"
      - name: Copy the shared UI into the Android project
        run: |
          (node scripts/sync-mobile.js && cd mobile && npx cap sync android) 2>&1 | tee /tmp/sync.log \
            || bash scripts/ci-fail.sh /tmp/sync.log "cap-sync"
      - name: Create signing key
        working-directory: mobile/android
        run: |
          keytool -genkeypair -v \
            -keystore sentinel-release.jks \
            -storepass sentinel \
            -keypass sentinel \
            -alias sentinel \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=SENTINEL, OU=Personal, O=SENTINEL, L=Wilamowice, C=PL"
          printf 'storeFile=sentinel-release.jks\nstorePassword=sentinel\nkeyAlias=sentinel\nkeyPassword=sentinel\n' > keystore.properties
      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log \
            || bash ../../scripts/ci-fail.sh /tmp/gradle.log "gradle"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SENTINEL-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-android
          path: SENTINEL-android.apk
          if-no-files-found: error
          retention-days: 30

  # ── ESP32 firmware ───────────────────────────────────────────────────────
  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade platformio
          pio --version
      - name: Build
        working-directory: firmware
        run: |
          pio run -e esp32dev 2>&1 | tee /tmp/pio.log \
            || bash ../scripts/ci-fail.sh /tmp/pio.log "firmware"
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-firmware
          path: firmware/.pio/build/esp32dev/firmware.bin
          if-no-files-found: warn
          retention-days: 30

  # ── publish: rolling "latest" pre-release so the phone can download the APK ──
  publish:
    name: Publish latest builds
    needs: [windows, android]
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten and list
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.bin' \) -exec cp {} out/ \;
          ls -lh out
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "SENTINEL latest build" \
              --notes "Automatically built from ${{ github.sha }} on ${{ github.ref_name }}. Download the installer, the portable exe or the APK below."
          gh release upload latest out/* --clobber
          gh release view latest --json assets -q '.assets[] | "\(.name) \(.size)"'
