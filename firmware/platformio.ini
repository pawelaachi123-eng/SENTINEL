; ============================================================================
;  SENTINEL ESP32 bridge
;  Build:  pio run -e esp32dev          (PlatformIO, no Arduino IDE needed)
;  Flash:  pio run -e esp32dev -t upload
;  Logs:   pio device monitor -b 115200
; ============================================================================

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
upload_speed = 460800

lib_deps =
  bblanchon/ArduinoJson@^7.2.0

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSENTINEL_FW_VERSION="2.0.0"
  -DSENTINEL_USE_WIREGUARD=1
  -I lib/WireGuard-ESP32/src

build_unflags = -DCORE_DEBUG_LEVEL=0

; Variant without WireGuard (smaller flash, plain Wi-Fi only).
[env:esp32dev-nowg]
extends = env:esp32dev
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSENTINEL_FW_VERSION="2.0.0"
  -DSENTINEL_USE_WIREGUARD=0
  -I lib/WireGuard-ESP32/src

; ESP32-S3 and C3 boards work too — change the board line, keep the rest.
[env:esp32s3]
extends = env:esp32dev
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
